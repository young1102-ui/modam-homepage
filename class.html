<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MODAM · 수업자료실 비밀번호 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #fdfbf7;
    color: #2c251f;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .pw-container {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border: 1px solid #eadfce;
    border-radius: 28px;
    padding: 40px 32px;
    box-shadow: 0 20px 50px rgba(34, 28, 21, 0.08);
    text-align: center;
  }
  .pw-badge {
    display: inline-block;
    background: #f7f2ea;
    color: #8b6f5e;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .pw-title {
    font-family: "Gowun Batang", serif;
    font-size: 26px;
    margin: 0 0 10px 0;
    color: #211b17;
  }
  .pw-desc {
    font-size: 15px;
    color: #6e6259;
    line-height: 1.5;
    margin: 0 0 28px 0;
  }
  .pw-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .pw-input {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid #dcd2c4;
    border-radius: 14px;
    font-size: 16px;
    outline: none;
    background-color: #faf8f5;
    transition: all 0.2s ease;
    text-align: center;
    letter-spacing: 2px;
  }
  .pw-input:focus {
    border-color: #8b6f5e;
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(139, 111, 94, 0.15);
  }
  .pw-submit-btn {
    width: 100%;
    padding: 15px;
    background: #8b6f5e;
    color: #ffffff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .pw-submit-btn:hover {
    background: #73594a;
  }
  .pw-error {
    margin-top: 14px;
    font-size: 14px;
    color: #d93838;
    font-weight: 600;
    display: none;
  }
  .pw-footer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid #f2ebe1;
    font-size: 13px;
    color: #9e9185;
  }
  .pw-footer a {
    color: #8b6f5e;
    text-decoration: none;
    font-weight: 600;
  }
  .pw-footer a:hover {
    text-decoration: underline;
  }
</style>
<meta name="robots" content="noindex, follow" />
</head>
<body>

<div class="pw-container">
  <span class="pw-badge">🔒 MODAM 수강생 전용</span>
  <h1 class="pw-title">수업자료실 입장</h1>
  <p class="pw-desc">안내받으신 비밀번호를 입력하시면<br>해당 수업 자료실 페이지로 이동합니다.</p>

  <form class="pw-form" id="pwForm">
    <input type="password" id="pwInput" class="pw-input" placeholder="비밀번호 입력" required autofocus autocomplete="current-password" />
    <button type="submit" class="pw-submit-btn">입장하기 →</button>
  </form>

  <p id="pwError" class="pw-error">비밀번호가 올바르지 않습니다.</p>

  <div class="pw-footer">
    메인으로 돌아가기: <a href="https://www.young2026.com">www.young2026.com</a>
  </div>
</div>

<script>
  // =========================================================================
  // ★ 비밀번호 및 각 비밀번호별 이동할 페이지 주소(URL) 설정
  // 원하시는 비밀번호와 사이트 주소를 마음껏 추가하거나 수정하실 수 있습니다.
  // =========================================================================
  const PASSWORD_MAP = {
    "0915": "https://sites.google.com/view/modam-class-main",   // 기본/통합 수업자료실 주소
    "1004": "https://sites.google.com/view/modam-class-a",      // 1004 입력 시 A반 페이지로 이동
    "2004": "https://sites.google.com/view/modam-class-b",      // 2004 입력 시 B반 페이지로 이동
    "3004": "https://sites.google.com/view/modam-class-c"       // 3004 입력 시 C반 페이지로 이동
  };

  const pwForm = document.getElementById("pwForm");
  const pwInput = document.getElementById("pwInput");
  const pwError = document.getElementById("pwError");

  pwForm.addEventListener("submit", function(e) {
    e.preventDefault();
    const inputVal = pwInput.value.trim();

    // 입력한 비밀번호가 PASSWORD_MAP 목록에 존재하는지 확인
    if (PASSWORD_MAP[inputVal]) {
      pwError.style.display = "none";
      // 해당 비밀번호에 연결된 URL로 즉시 이동
      window.location.href = PASSWORD_MAP[inputVal];
    } else {
      // 비밀번호가 틀린 경우 에러 메시지 표시
      pwError.style.display = "block";
      pwInput.select();
    }
  });
</script>

</body>
</html>
